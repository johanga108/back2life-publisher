name: Publish daily Threads posts

on:
  schedule:
    # 09:07 Europe/Moscow.
    - cron: "7 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Publish immediately, ignoring the morning schedule"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: back2life-threads-daily
  cancel-in-progress: false

jobs:
  publish-threads:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Create .env from GitHub secrets
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_API_VERSION: ${{ secrets.THREADS_API_VERSION }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          names = ["THREADS_ACCESS_TOKEN", "THREADS_USER_ID"]
          optional_names = ["THREADS_API_VERSION"]
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit(f"Missing GitHub secrets: {', '.join(missing)}")
          Path(".env").write_text(
              "\n".join(
                  f"{name}={os.environ[name]}"
                  for name in names + optional_names
                  if os.environ.get(name)
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Publish next daily Threads post
        id: publish
        env:
          PUBLISH_FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          set +e
          args=()
          if [ "$PUBLISH_FORCE" = "true" ]; then
            args+=(--force)
          fi
          python3 scripts/publish_threads_daily.py "${args[@]}" > threads-output.log 2>&1
          code=$?
          cat threads-output.log
          {
            echo "## Daily Threads output"
            echo
            echo '```text'
            cat threads-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Save daily Threads state
        run: |
          git config user.name "back2life-publisher-bot"
          git config user.email "actions@github.com"
          git add state/threads-state.json
          if git diff --cached --quiet; then
            echo "No daily Threads state changes to commit."
            exit 0
          fi
          git commit -m "Update daily Threads state"
          git pull --rebase
          git push

      - name: Fail workflow if publishing failed
        if: steps.publish.outputs.exit_code != '0'
        run: exit "${{ steps.publish.outputs.exit_code }}"
